<style>
  :root {

    --border: #ececef;

    --gray: #6b7280;

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  .app {

  header.head {

  h1 {

  .sub {

  .legend {

  .legend-item {

  .dot {

  .dot.gray { background: var(--gray); }

  .date-nav-wrap {

    margin: 0 -16px 20px;
    padding: 10px 12px 12px;
    border-bottom: 1px solid var(--border);

  .cal-weekdays { margin-bottom: 6px; }

    font-size: 11px;
    color: var(--text-faint);
    font-weight: 500;
    letter-spacing: -0.2px;
  }
  .cal-grid {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .date-nav.collapsed .cal-row { display: none; }
  .date-nav.collapsed .cal-row.show { display: grid; }

  .cal-toggle {

    font-size: 14px;
    font-weight: 600;

    font-family: inherit;

  .cal-toggle .ico { font-size: 11px; margin-right: 3px; color: var(--text-soft); }
  .cal-cell {
    position: relative;
    min-height: 50px;
    padding: 2px 1px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--text);
    background: var(--card);
    border: 1.5px solid var(--border);
    transition: transform .12s ease, background .15s ease, color .15s ease, border-color .15s ease;

  .cal-cell:active { transform: scale(0.95); }
  .cal-cell .dnum { font-size: 15px; font-weight: 600; line-height: 1.2; }
  .cal-cell .dmark {
    font-size: 10px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: 0.1px;
    white-space: nowrap;
  }

  .cal-cell .dmark.sub { font-weight: 500; opacity: 0.72; }
  .cal-cell .mflag {
    position: absolute;
    top: 3px;
    right: 4px;
    font-size: 9px;
    color: var(--text-faint);
    font-weight: 500;
  }
  /* 行程内的日子：浅底 + 彩色描边 + 同色文字 */
  .cal-cell.gray   { background: var(--gray-bg);   border-color: #d6d8dc; color: var(--gray); }
  .cal-cell.orange { background: var(--orange-bg); border-color: #fdba74; color: var(--orange); }
  .cal-cell.red    { background: var(--red-bg);    border-color: #fca5a5; color: var(--red); }
  /* 今天：深色实心 */
  .cal-cell.today {
    background: var(--text);
    border-color: var(--text);
    color: #fff;
  }
  .cal-cell.today .mflag { color: rgba(255,255,255,0.6); }
  /* 当前浏览到的那天：外圈 */
  .cal-cell.active { box-shadow: 0 0 0 2px rgba(28,29,32,0.18); }
  /* 行程外：淡到几乎不可见、不可点 */
  .cal-cell.off {
    background: transparent;
    border-color: transparent;
    color: #d4d6db;
    pointer-events: none;
  }

  .day {

    body { font-size: 17px; }

    .app { padding: 36px 24px 96px; }
  }
</style>

/* ===================== Render ===================== */
function kindLabel(k){ return k === 'amap' ? '高德地图' : '大众点评'; }

function poiChip(p){
  const safeName = String(p.name).replace(/"/g, '&quot;');
  const safeUrl  = String(p.url).replace(/"/g, '&quot;');
  if (p.kind === 'amap') {
    return `<a class="poi amap" href="${p.url}" rel="noopener" aria-label="在${kindLabel(p.kind)}打开${p.name}">
              <span>${kindLabel(p.kind)}</span>
              <span class="nm">${p.name}</span>
              <span class="arr">↗</span>
            </a>`;
  }
  // 大众点评 m 站在微信内置浏览器里会被其登录层拦截（错误码 10005），
// 自动跳转尝试也无法绕过，因此回退为可靠的"复制链接 + 提示在 App 内粘贴"方案。
return `<a class="poi dianping dp-copy" href="javascript:void(0)" data-url="${safeUrl}" data-name="${safeName}" role="button" aria-label="复制大众点评链接 ${p.name}">
          <span>${kindLabel(p.kind)}</span>
          <span class="nm">${p.name}</span>
          <span class="arr">⧉</span>
        </a>`;
}

function renderDays(){
  const root = document.getElementById('days');
  root.innerHTML = days.map(d => {
    const itemsHtml = d.events.map(ev => {
      if (ev.empty) {
        return `<div class="empty"><div class="em">🍃</div>${ev.text}</div>`;
      }
      const poiHtml = ev.poi ? poiChip(ev.poi) : '';
      const poiListHtml = (ev.poiList && ev.poiList.length)
        ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">${ev.poiList.map(poiChip).join('')}</div>`
        : '';
      const noteHtml = ev.note ? `<div class="note">${ev.note}</div>` : '';
      return `
        <div class="item">
          ${ev.time ? `<div class="time">${ev.time}</div>` : `<div class="time"></div>`}
          <div class="content">
            <div class="title">${ev.text}</div>
            ${noteHtml}
            ${poiHtml}
            ${poiListHtml}
          </div>
        </div>`;
    }).join('');

    const altsHtml = (d.alts && d.alts.length)
      ? `<div class="alts">
          <div class="alts-title">备选</div>
          <div class="alt-list">
            ${d.alts.map(a => {
              if (a.kind === 'amap') {
                return `<a class="alt amap" href="${a.url}" rel="noopener">${a.name} · ${kindLabel(a.kind)} ↗</a>`;
              }
              const safeName = String(a.name).replace(/"/g, '&quot;');
              const safeUrl  = String(a.url).replace(/"/g, '&quot;');
              return `<a class="alt dianping dp-copy" href="javascript:void(0)" data-url="${safeUrl}" data-name="${safeName}" role="button">${a.name} · ${kindLabel(a.kind)} ⧉</a>`;
            }).join('')}
          </div>
        </div>` : '';

    return `
      <section class="day ${d.type}" id="day-${d.date}" data-date="${d.date}">
        <div class="day-header">
          <div class="main">${d.short}</div>
          <div class="week">${d.week}</div>
          <div class="tag">${d.tag}</div>
          <div class="day-weather" data-wx="${d.date}">
            <span class="city">—</span>
            <span class="wx">点击查看天气</span>
          </div>
        </div>
        <div class="day-remind">记得检查带电话手表，记得遛狗 🐶</div>
        <div class="day-body">${itemsHtml}${altsHtml}</div>
      </section>`;
  }).join('');
}

function renderNav(){
  const nav = document.getElementById('dateNav');
  const weekdays = ['周一','周二','周三','周四','周五','周六','周日'];
  let html = '<div class="cal-weekdays">'
           + weekdays.map(w => `<span>${w}</span>`).join('')
           + '</div><div class="cal-grid">';
  calendar.forEach((row, wi) => {
    html += `<div class="cal-row" data-week="${wi}">`;
    row.forEach(c => {
      const mflag = c.mflag ? `<span class="mflag">${c.mflag}</span>` : '';
      if (!c.key) {
        // 行程外的日子：淡灰、不可点，只占位保持日历对齐
        html += `<div class="cal-cell off" aria-hidden="true">${mflag}<span class="dnum">${c.d}</span></div>`;
        return;
      }
      const day = days.find(x => x.date === c.key);
      const type = day ? day.type : 'gray';
      // 数字下方最多两行：出发/返程 → 当日类型
      const marks = [];
      if (c.mark) marks.push(`<span class="dmark">${c.mark}</span>`);
      if (c.sub)  marks.push(`<span class="dmark sub">${c.sub}</span>`);
      html += `<a class="cal-cell ${type}" href="#day-${c.key}" data-date="${c.key}">${mflag}<span class="dnum">${c.d}</span>${marks.join('')}</a>`;
    });
    html += '</div>';
  });
  html += '</div><button class="cal-toggle" id="calToggle" type="button"><span class="ico">▼</span>展开全部三周</button>';
  nav.innerHTML = html;
  updateCalToggleText();
}

/* ---- 日历折叠：跳转后只保留目标日期所在的那一周 ---- */
/* 返回日期在 calendar 里的行索引，找不到返回 -1 */
function weekIndexOf(key){
  for (let i = 0; i < calendar.length; i++) {
    if (calendar[i].some(c => c.key === key)) return i;
  }
  return -1;
}
function showWeekOnly(weekIndex){
  const nav = document.getElementById('dateNav');
  if (!nav || weekIndex < 0) return;
  nav.classList.add('collapsed');
  nav.querySelectorAll('.cal-row').forEach(r => {
    r.classList.toggle('show', r.dataset.week === String(weekIndex));
  });
  updateCalToggleText();
}
function expandAllWeeks(){
  const nav = document.getElementById('dateNav');
  if (!nav) return;
  nav.classList.remove('collapsed');
  updateCalToggleText();
}
function updateCalToggleText(){
  const btn = document.getElementById('calToggle');
  if (!btn) return;
  const nav = document.getElementById('dateNav');
  const collapsed = !!(nav && nav.classList.contains('collapsed'));
  btn.innerHTML = collapsed
    ? '<span class="ico">▼</span>展开全部三周'
    : '<span class="ico">▲</span>收起';
}

/* ===================== "Today" positioning ===================== */
function todayKey(){
  const t = new Date();
  const y = t.getFullYear();
  const m = String(t.getMonth()+1).padStart(2,'0');
  const d = String(t.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function inTrip(key){
  return key >= tripStart && key <= tripEnd;
}

/* sticky 日历的实际高度（每次实时读，避免写死后对不齐）*/
function navOffset(){
  const el = document.querySelector('.date-nav-wrap');
  return (el ? el.offsetHeight : 196) + 8;   // +8 让卡片标题栏和日历之间留一点空隙
}
/* 把某一天滚到"日历正下方"，确保是从卡片顶部开始展示 */
function scrollDayIntoView(key, behavior){
  const target = document.getElementById('day-' + key);
  if (!target) return;
  const top = target.getBoundingClientRect().top + window.pageYOffset - navOffset();
  window.scrollTo({ top: Math.max(top, 0), behavior: behavior || 'smooth' });
}

function scrollToToday(init){
  const key = todayKey();
  const target = document.getElementById('day-' + key);
  const fab = document.getElementById('fab');

  // 当前日期落在行程内 → 滚动；之外或无对应 section → 不滚动
  if (target && inTrip(key)) {
    if (init) {
      // 初次加载：滚动到对应日程（iOS 微信需等渲染完成）
      requestAnimationFrame(() => {
        scrollDayIntoView(key, 'auto');
      });
    }
  }

  // 高亮日历上的今天
  document.querySelectorAll('.cal-cell').forEach(p => {
    p.classList.toggle('today', p.dataset.date === key && inTrip(key));
  });

  if (init) {
    fab.classList.remove('show');
  }
}

function scrollToDate(key){
  scrollDayIntoView(key, 'smooth');
}

/* ===================== FAB ===================== */
let initScrolled = false;
let manualExpandWeek = -1;   // 手动展开保持态：-1=自动折叠模式；>=0=保持三周(参考周)
let manualExpandTimer = 0;   // calToggle 短暂保持态超时句柄，到期复位回自动折叠
let currentActiveKey = null; // scroll 监听里最近算出的"正在看的那天"，供点击处理读取
window.addEventListener('scroll', () => {
  if (!initScrolled) {
    // 第一次用户滚动后允许显示 FAB
    initScrolled = (window.scrollY > 80);
  }
  const key = todayKey();
  const fab = document.getElementById('fab');
  if (initScrolled && inTrip(key)) fab.classList.add('show');
  else fab.classList.remove('show');

  // 滚动时做三件事：① 控制 FAB 显隐；② 自动折叠日历到当前周(详见下方)；③ 高亮当前正在看的那天。
  // 折叠只收成"当周一行"、不动布局，跨 9/24↔9/25(同周) 边界高度不变，因此不会抖。
  // 取"顶部已滚过日历下沿"的最后一天，作为当前正在看的那天。
  const stickyH = navOffset();
  let activeKey = null;
  for (const d of days) {
    const el = document.getElementById('day-' + d.date);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    if (r.top <= stickyH + 8) activeKey = d.date;
    else break;
  }
  currentActiveKey = activeKey;   // 缓存给点击处理读取，避免点击 calToggle 后被 scroll 监听立即折叠

  // 滚动自动折叠：进入任意行程日，导航收成"当周一行"省屏。
  // 关键修复：不再对 9/24(出发日) 做"自动全展开"特例——9/24 与 9/25 同属第一周，
  // 旧逻辑 keepAll 在 9/24(展开三行)/9/25(折叠一行) 间反复跳，触发高度三行↔一行
  // 切换的抖动。现在统一折叠当周，跨 24/25 边界 week 都=0，导航高度不变，不抖。
  // 手动展开保持态(manualExpandWeek>=0)：仅当用户滚动到"不同周"时才收起，
  // 同周内浏览保持三周；一旦跨周自动折叠，立即复位回自动模式，避免"折叠后不再响应"。
  if (activeKey) {
    const nav = document.getElementById('dateNav');
    if (nav) {
      const week = weekIndexOf(activeKey);
      if (manualExpandWeek >= 0) {
        if (manualExpandWeek !== week) { manualExpandWeek = -1; showWeekOnly(week); }
      } else {
        const isCollapsed = nav.classList.contains('collapsed');
        const curRow = nav.querySelector('.cal-row.show');
        const curWeek = curRow ? curRow.dataset.week : null;
        // 仅在"展开态需折叠"或"已折叠但所在周变化"时才动 DOM，避免无谓重排
        if (!isCollapsed || curWeek !== String(week)) showWeekOnly(week);
      }
    }
  }

  if (activeKey) {
    document.querySelectorAll('.cal-cell').forEach(p => p.classList.remove('active'));
    const ap = document.querySelector(`.cal-cell[data-date="${activeKey}"]`);
    if (ap) ap.classList.add('active');
  }
}, { passive: true });

document.getElementById('fab').addEventListener('click', () => {
  const key = todayKey();
  scrollToDate(key);
  loadWeatherForDate(key);
});

// 平滑滚动处理：点击日历上的日期
document.getElementById('dateNav').addEventListener('click', (e) => {
  // 先处理"展开全部三周"按钮：临时展开全程，回到自动折叠模式(一滚即收起当周)
  if (e.target.closest('#calToggle')) {
    e.preventDefault();
    // 按钮可切换：折叠态点 → 展开三周；展开态点 → 收成当周一行（合并）
    const nav = document.getElementById('dateNav');
    const collapsed = !!(nav && nav.classList.contains('collapsed'));
    clearTimeout(manualExpandTimer);
    if (collapsed) {
      // 折叠 → 展开：进入短暂"保持态"防 iOS 微信点击 button 触发的微小 scroll
      // 立即折回（修了 16:32 bug），约 300ms 后复位回自动折叠模式
      const wk = (currentActiveKey && weekIndexOf(currentActiveKey) >= 0) ? weekIndexOf(currentActiveKey) : -1;
      manualExpandWeek = wk;
      expandAllWeeks();
      manualExpandTimer = setTimeout(() => { manualExpandWeek = -1; }, 300);
    } else {
      // 展开 → 折叠：收成当前正在看的天所在的那一行
      const wk = (currentActiveKey && weekIndexOf(currentActiveKey) >= 0) ? weekIndexOf(currentActiveKey) : 0;
      manualExpandWeek = -1;
      showWeekOnly(wk);
    }
    return;
  }
  const a = e.target.closest('.cal-cell');
  if (!a) return;
  e.preventDefault();
  const key = a.dataset.date;
  // 点击任意日期都展开全程三周（点击=展开），由滚动自动折叠省屏：
  // 进入"保持态"(参考周=该日期所在周)，同周内浏览保持三周，跨周滚动时自动收起当周。
  // 这样第一日与其余日期行为一致，不再有"其他日点击展开无效"的差异。
  manualExpandWeek = weekIndexOf(key);
  expandAllWeeks();
  // 先改日历视图再滚动，这样 navOffset() 读到的是展开后的新高度
  scrollToDate(key);
  loadWeatherForDate(key);
});

  61:['小雨','🌦️'], 63:['中雨','🌧️'], 65:['大雨','🌧️'],
  66:['冻雨','🌧️'], 67:['强冻雨','🌧️'],
  71:['小雪','🌨️'], 73:['中雪','❄️'], 75:['大雪','❄️'], 77:['米雪','🌨️'],
  80:['阵雨','🌦️'], 81:['强阵雨','🌧️'], 82:['猛烈阵雨','⛈️'],
  85:['阵雪','🌨️'], 86:['强阵雪','❄️'],
  95:['雷暴','⛈️'], 96:['雷暴+冰雹','⛈️'], 99:['强雷暴+冰雹','⛈️'],
};
const WX_CACHE_TTL = 2 * 60 * 60 * 1000; // 2 小时
const wxCacheKey = (date, city) => `wx:${date}:${city}`;
function readWxCache(date, city){
  try {
    const raw = localStorage.getItem(wxCacheKey(date, city));
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || !obj.ts || !obj.data) return null;
    if (Date.now() - obj.ts > WX_CACHE_TTL) return null;
    return obj.data;
  } catch(e){ return null; }
}
function writeWxCache(date, city, data){
  try { localStorage.setItem(wxCacheKey(date, city), JSON.stringify({ ts: Date.now(), data })); } catch(e){}
}
function renderWxChip(date, data){
  const el = document.querySelector(`.day-weather[data-wx="${date}"]`);
  if (!el) return;
  if (!data) {
    el.innerHTML = '<span class="city">—</span><span class="wx">点击查看预报</span>';
    return;
  }
  el.classList.remove('loading');
  const { city, label, icon, tempHi, tempLo, isForecast } = data;
  // 预报：低~高°C；超 16 天兜底：单一值 + "实时" 小字
  let tempText;
  if (isForecast) {
    tempText = (tempHi === tempLo) ? `${tempHi}°C` : `${tempLo}~${tempHi}°C`;
  } else {
    tempText = `${tempHi}°C<span class="fx">实时</span>`;
  }
  el.innerHTML = `<span class="city">${city}</span><span class="wx">${icon||''} ${label}</span><span class="temp" data-fc="${isForecast?'1':'0'}">${tempText}</span>`;
}
async function loadWeatherForDate(date){
  const city = CITY_BY_DATE[date];
  if (!city) return;

  // 1) 命中有效缓存（< 2h）直接用，不发请求
  const cached = readWxCache(date, city);
  if (cached) { renderWxChip(date, cached); return; }

  // 2) 否则 fetch；先尝试 daily 预报，失败（超 16 天）回退到 current_weather
  const el = document.querySelector(`.day-weather[data-wx="${date}"]`);
  if (el) { el.classList.add('loading'); el.innerHTML = `<span class="city">${CITIES[city].name}</span><span class="wx">预报获取中…</span>`; }
  const c = CITIES[city];
  const fcstUrl = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&daily=weathercode,temperature_2m_max,temperature_2m_min&current_weather=true&timezone=auto&start_date=${date}&end_date=${date}`;
  const nowUrl  = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current_weather=true&timezone=auto`;

  try {
    let resolved = false;
    const r = await fetch(fcstUrl);
    if (r.ok) {
      const j = await r.json();
      const daily = j.daily || {};
      const codeArr = daily.weathercode || [];
      const tmaxArr = daily.temperature_2m_max || [];
      const tminArr = daily.temperature_2m_min || [];
      if (codeArr.length > 0 && codeArr[0] != null) {
        // 16 天内 → 当天预报
        const code = codeArr[0];
        const [label, icon] = WX_CODE[code] || ['',''];
        const data = {
          city: c.name, label, icon,
          tempHi: Math.round(tmaxArr[0] ?? 0),
          tempLo: Math.round(tminArr[0] ?? 0),
          isForecast: true,
          code,
        };
        writeWxCache(date, city, data);
        renderWxChip(date, data);
        resolved = true;
      }
    }
    if (!resolved) {
      // 兜底：超 16 天（或网络异常被 r.ok=false 拦截）→ 城市当前实况
      const r2 = await fetch(nowUrl);
      if (!r2.ok) throw new Error('http ' + r2.status);
      const j2 = await r2.json();
      const cw = j2.current_weather || {};
      if (cw.weathercode == null) throw new Error('no weathercode');
      const code = cw.weathercode;
      const [label, icon] = WX_CODE[code] || ['',''];
      const t = Math.round(cw.temperature ?? 0);
      const data = {
        city: c.name, label, icon,
        tempHi: t, tempLo: t,
        isForecast: false,
        code,
      };
      writeWxCache(date, city, data);
      renderWxChip(date, data);
    }
  } catch(e) {
    if (el) { el.classList.remove('loading'); el.innerHTML = `<span class="city">${c.name}</span><span class="wx">获取失败</span>`; }
  }
}

/* ===================== Dianping copy helper ===================== */
// 大众点评 m 站 m.dianping.com 在微信内置浏览器里会被其登录层拦截（错误码 10005），
// 之前尝试过的"自动跳转（Universal Link / location.href）"方案仍然会触发同一报错。
// 这里回退为最稳定的"复制 + 提示"方案，让家人手动到大众点评 App 内粘贴 / 搜店名。
function showToast(msg, dur){
  let t = document.getElementById('wbToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'wbToast';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tmo);
  t._tmo = setTimeout(() => t.classList.remove('show'), dur || 2400);
}
function copyText(text){
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  ta.style.top = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  return Promise.resolve();
}
document.addEventListener('click', function(e){
  // 高德地图：同窗口导航，触发 surl.amap.com Universal Link 唤起高德 App 或在浏览器打开。
  // 关键：不带 target="_blank"——微信内置浏览器对 target=_blank 已升级拦截为"应用不支持在微信内打开"。
  const amapEl = e.target.closest('a.poi.amap, a.alt.amap');
  if (amapEl && amapEl.href) {
    e.preventDefault();
    e.stopPropagation();
    window.location.href = amapEl.href;
    return;
  }
  const el = e.target.closest('.dp-copy');
  if (!el) return;
  e.preventDefault();
  e.stopPropagation();
  const url  = el.dataset.url  || '';
  const name = el.dataset.name || '';
  // 同时复制店名 + 链接：粘贴到大众点评 App 内的对话框也能被识别，或直接搜店名
  copyText(`${name}\n大众点评：${url}`).then(() => {
    showToast(`已复制「${name}」\n请到「大众点评」App 内粘贴访问，或直接搜店名`);
  }).catch(() => {
    showToast('复制失败，请长按上方按钮选择复制');
  });
}, false);
